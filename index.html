<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planning Événements</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planning">
<meta name="theme-color" content="#1f6f4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<script>document.write('<script src="config.js?' + Date.now() + '"><\/script>');</script>
<script src="xlsx.js"></script>
<style>
:root{--bg:#f4f3ef;--card:#fff;--ink:#1c1c1a;--mut:#6f6d66;--line:#e3e1da;--acc:#1f6f4a;--acc2:#e7f2ec;--warn:#b4541a;--warn2:#fbeee4;--r:16px}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1f1e1c;--ink:#f1efe8;--mut:#a09d94;--line:#34322e;--acc:#4fb784;--acc2:#1d3328;--warn:#e88a4f;--warn2:#3a2a1f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 96px)}
header h1{font-size:15px;font-weight:600;margin:0;color:var(--mut);letter-spacing:.02em;text-transform:uppercase}
.sync{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px;margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}.dot.ok{background:var(--acc)}.dot.loc{background:var(--warn)}
.chips{display:flex;gap:8px;margin:14px 0 6px}
.chip{flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:10px 6px;font-size:15px;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.clock{font-size:64px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;text-align:center;line-height:1;margin:8px 0 4px}
.date{text-align:center;color:var(--mut);text-transform:capitalize}
.big{display:block;width:100%;border:0;border-radius:20px;padding:22px;font-size:20px;font-weight:700;margin-top:16px;color:#fff;background:var(--acc)}
.big.out{background:var(--warn)}.big:disabled{background:var(--line);color:var(--mut)}
.big:active{transform:scale(.985)}
.status{display:flex;justify-content:space-around;text-align:center;margin-top:14px}
.status b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.status span{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.note{background:var(--warn2);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:12px}
.lnk{background:none;border:0;color:var(--acc);font-weight:600;font-size:15px;padding:8px 0}
.wk h3{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:18px 4px 6px;display:flex;justify-content:space-between}
.day{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:6px 0}
.day.today{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.day .lbl{font-weight:600;text-transform:capitalize}.day .tot{font-variant-numeric:tabular-nums;color:var(--mut);font-size:14px;text-align:right}
.day .times{grid-column:1/-1;display:flex;gap:8px;align-items:center}
.day input[type=time]{flex:1;min-width:0;font:inherit;font-size:17px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.sg{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.sg button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.sg button.on{background:var(--acc2);color:var(--acc);border-color:transparent}
.clr{border:0;background:none;color:var(--mut);font-size:20px;padding:0 4px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase}
tr.strong td{font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
nav button{flex:1;border:0;background:none;color:var(--mut);font-size:12px;font-weight:600;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:24px;height:24px}nav button.on{color:var(--acc)}
.msg{text-align:center;font-size:14px;color:var(--mut);margin-top:10px;min-height:20px}
.hide{display:none!important}
body.ro .day input,body.ro .day .clr,body.ro .sg button{pointer-events:none;opacity:.55}
#testbar{display:none;background:#fff3c4;color:#5c4400;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px;line-height:2}
body.test #testbar{display:block}
#testbar select,#testbar button{font:inherit;font-size:14px;border:1px solid #d9c27a;background:#fffbe8;color:#5c4400;border-radius:8px;padding:3px 8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.modal .card{width:100%;max-width:560px;margin:0;border-radius:20px 20px 0 0;padding-bottom:calc(env(safe-area-inset-bottom) + 16px)}
.row2{display:flex;gap:10px;margin-top:14px}.row2 button{flex:1;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px;font-weight:600}
.row2 button.pri{background:var(--acc);color:#fff;border:0}
.row2 button:disabled{opacity:.6}
#lmsg{color:var(--warn);text-align:left}
</style>
<style>
.adm input,.adm select{font:inherit;font-size:15px;padding:7px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-width:0;width:100%}
.adm .it{border-top:1px solid var(--line);padding:10px 0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.adm label{display:flex;align-items:center;gap:6px;font-size:14px}.adm label input{width:auto}
.adm .sub{margin-top:8px;font-weight:600;font-size:14px;color:var(--mut)}
#detail table td,#detail table th{padding:6px 3px}
#sum th,#sum td{white-space:nowrap;padding:8px 6px}
.adm label.full{grid-column:1/-1}.adm label.full input{flex:1;width:auto}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="ttl">Planning Événements</h1>
    <select id="evsel" class="hide" style="margin-top:8px;width:100%;font:inherit;font-size:16px;font-weight:600;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)"></select>
    <div class="sync"><span class="dot" id="dot"></span><span id="synctxt">Connexion…</span></div>
    <div class="sync" id="who" style="font-weight:600"></div>
  </header>
  <div id="testbar"><b>MODE TEST</b> — rien n'est enregistré. Jour simulé : <select id="tday"></select> <button id="tclear">Vider</button> <button id="tquit">Quitter</button></div>
  <div class="chips" id="chips"></div>

  <section id="v-pointer">
    <div class="card">
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="today"></div>
      <div class="status">
        <div><b id="sIn">—</b><span>Arrivée</span></div>
        <div><b id="sOut">—</b><span>Départ</span></div>
        <div><b id="sTot">—</b><span>Durée</span></div>
      </div>
      <button class="big" id="btn">Pointer</button>
      <div id="pnote"></div>
    </div>
    <div class="card"><table id="mini"></table></div>
  </section>

  <section id="v-planning" class="hide"><div class="wk" id="weeks"></div></section>

  <section id="v-export" class="hide">
    <div class="card" style="overflow-x:auto"><table id="sum"></table></div>
    <div class="card" id="detail"></div>
    <div id="admin" class="hide">
      <button class="big" id="exp">Télécharger le planning complet (.xlsx)</button>
      <div class="msg" id="emsg">Toutes les personnes de l'événement, avec formules et totaux.</div>
      <div class="card adm" id="periodes"></div>
      <div class="card adm" id="users"></div>
    </div>
    <div style="text-align:center;margin-top:18px"><button class="lnk" id="logout">Changer de code / se déconnecter</button></div>
  </section>
</div>

<nav>
  <button data-v="pointer" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Pointer</button>
  <button data-v="planning"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Planning</button>
  <button data-v="export"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3h16v-3"/></svg>Totaux</button>
</nav>

<div class="modal hide" id="login"><div class="card"><div style="font-size:18px;font-weight:700;margin-bottom:8px">Code d'accès</div><div style="color:var(--mut);font-size:14px">Saisis ton code personnel. Il est mémorisé sur ce téléphone.</div><input id="lcode" type="password" autocomplete="current-password" style="width:100%;font:inherit;font-size:18px;padding:12px;margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)"><div class="msg" id="lmsg"></div><div class="row2"><button class="pri" id="lok">Valider</button></div></div></div>
<div class="modal hide" id="modal"><div class="card"><div id="mtxt"></div><div class="row2"><button id="mno">Annuler</button><button class="pri" id="myes">Confirmer</button></div></div></div>

<script>
// ===================== Planning Béthune — page =====================
const $ = id => document.getElementById(id);
const escH = t => String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const hm = d => pad2(d.getHours()) + ":" + pad2(d.getMinutes());
const ddmm = d => pad2(d.getDate()) + "/" + pad2(d.getMonth() + 1);
const nice = l => l.replace("TOTAL ", "").toLowerCase().replace(/^./, c => c.toUpperCase());
const MOIS_C = { janvier: "janv.", février: "févr.", mars: "mars", avril: "avr.", mai: "mai", juin: "juin", juillet: "juil.", août: "août", septembre: "sept.", octobre: "oct.", novembre: "nov.", décembre: "déc." };
const short = l => l.replace(/ \d{4}$/, "").replace(/ (\S+)$/, (m, mo) => " " + (MOIS_C[mo] || mo));
const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: k => { try { localStorage.removeItem(k); } catch (e) {} } };

// ---------- Connexion à Supabase ----------
const CFG = window.POINTEUSE_CONFIG || {};
const API_KEY = String(CFG.supabaseAnonKey || CFG.supabaseKey || "").trim();
const API_URL = (() => {
  const u = String(CFG.supabaseUrl || "").trim();
  const m = /supabase\.com\/dashboard\/project\/([a-z0-9]+)/i.exec(u);
  if (m) return "https://" + m[1] + ".supabase.co";
  try { return new URL(u).origin; } catch (e) { return u.replace(/\/+$/, ""); }
})();
let CODE = ls.get("ptg-code") || "";
async function rpc(fn, args) {
  const headers = { "Content-Type": "application/json", apikey: API_KEY };
  if (/^eyJ/.test(API_KEY)) headers.Authorization = "Bearer " + API_KEY;
  let r;
  try { r = await fetch(API_URL + "/rest/v1/rpc/" + fn, { method: "POST", headers, body: JSON.stringify(Object.assign({ p_code: CODE }, args || {})) }); }
  catch (x) { const e = new Error("réseau"); e.net = true; throw e; }
  if (!r.ok) { const t = await r.text(); const e = new Error(t); e.status = r.status; e.badCode = /code invalide/i.test(t); throw e; }
  return r.status === 204 ? null : r.json();
}
function explain(e) {
  if (e.badCode) return "Code incorrect.";
  if (e.net) return "Serveur injoignable (" + API_URL + "). Vérifie le réseau et supabaseUrl dans config.js.";
  try { const m = JSON.parse(e.message).message; if (m && !/Could not find/.test(m)) return m.charAt(0).toUpperCase() + m.slice(1) + "."; } catch (x) {}
  if (e.status === 401 || e.status === 403) return "Clé refusée par Supabase (" + e.status + "). Vérifie supabaseAnonKey dans config.js.";
  if (e.status === 404 || /PGRST202|Could not find the function/i.test(e.message)) return "Fonctions absentes dans Supabase : lance le script SQL de mise à jour.";
  return "Erreur " + (e.status || "") + " : " + String(e.message).slice(0, 160);
}

// ---------- État ----------
let WHO = null; try { WHO = JSON.parse(ls.get("ptg-who") || "null"); } catch (e) {}
let P = [], ROWS = [], DAYS = [], me = 0, view = "pointer";
// DATA = événement affiché (événement, personnes visibles) ; REAL = ses heures
let DATA = null; try { DATA = JSON.parse(ls.get("ptg-data") || "null"); } catch (e) {}
let EVT = +ls.get("ptg-evt") || 0;
let REAL = {}; try { REAL = JSON.parse(ls.get("ptg-recs") || "{}"); } catch (e) {}
// modifications pas encore envoyées : { "evt|iso_uid": { evt, iso, uid, start, end, sign } }
let dirty = {}; try { dirty = JSON.parse(ls.get("ptg-dirty") || "{}"); } catch (e) {}
let TEST = false, TEST_DAY = "", TESTRECS = {}, recs = REAL;
const saveLocal = () => { ls.set("ptg-recs", JSON.stringify(REAL)); ls.set("ptg-dirty", JSON.stringify(dirty)); ls.set("ptg-data", JSON.stringify(DATA)); ls.set("ptg-evt", EVT); };
const PER = () => DATA && DATA.evenement && DATA.evenement.id === EVT ? { id: EVT, libelle: DATA.evenement.nom, debut: DATA.evenement.debut, fin: DATA.evenement.fin } : null;
const EVTS = () => (WHO && WHO.evenements) || [];
// événement par défaut : celui choisi avant, sinon celui en cours aujourd'hui, sinon le premier
function pickEvt() {
  const L = EVTS(); if (L.some(e => e.id === EVT)) return;
  const t = isoOf(new Date()), now = L.find(e => !e.archive && e.debut <= t && t <= e.fin);
  EVT = now ? now.id : (L[0] ? L[0].id : 0);
}
const role = () => WHO ? WHO.role : null;
const cur = () => P[me];
const rec = (iso, p = cur()) => (p && recs[recKey(iso, p.id)]) || {};
const rowByIso = iso => DAYS.find(d => d.iso === iso);
function NOW() { const n = new Date(); if (!TEST) return n; const d = dateOf(TEST_DAY); d.setHours(n.getHours(), n.getMinutes(), n.getSeconds()); return d; }

// droits (la base vérifie de nouveau tout ce qui est envoyé)
const canEdit = p => !!p && !!WHO && (WHO.role === "admin" || (WHO.role === "responsable" && (p.id === WHO.id || p.role === "salarie")));
const canPoint = p => !!p && !!WHO && (canEdit(p) || p.id === WHO.id);

function applyWho() {
  P = (DATA && DATA.evenement && DATA.evenement.id === EVT && DATA.personnes) || [];
  const per = PER();
  ROWS = per ? buildRows(per.debut, per.fin) : []; DAYS = ROWS.filter(r => r.kind === "day");
  if (!TEST_DAY || !rowByIso(TEST_DAY)) TEST_DAY = DAYS.length ? DAYS[0].iso : "";
  const want = +ls.get("ptg-me-uid") || (WHO && WHO.id);
  me = Math.max(0, P.findIndex(p => p.id === want)); if (me < 0 || !P[me]) me = Math.max(0, P.findIndex(p => WHO && p.id === WHO.id));
  $("who").textContent = WHO ? WHO.nom + " · " + ({ admin: "administrateur", responsable: "responsable", salarie: "salarié" })[WHO.role] + "" : "";
  const L = EVTS();
  $("evsel").innerHTML = L.map(e => '<option value="' + e.id + '"' + (e.id === EVT ? " selected" : "") + ">" + escH(e.nom) + (e.archive ? " (archivé)" : "") + "</option>").join("");
  $("evsel").classList.toggle("hide", L.length < 2);
  $("ttl").textContent = per ? per.libelle : "Planning Événements";
  const sal = role() === "salarie";
  document.querySelector('nav button[data-v="planning"]').classList.toggle("hide", sal);
  if (sal && view === "planning") go("pointer");
  $("admin").classList.toggle("hide", role() !== "admin");
  planKey = ""; renderAll();
}

// ---------- Synchronisation ----------
function setSync(m, txt) { $("dot").className = "dot " + (m === "ok" ? "ok" : m === "loading" ? "" : "loc"); $("synctxt").textContent = txt; }
let pulling = false;
async function pull() {
  if (!CODE || pulling) return; pulling = true;
  try {
    const w = await rpc("ptg_me");
    if (JSON.stringify(w) !== JSON.stringify(WHO)) { WHO = w; ls.set("ptg-who", JSON.stringify(WHO)); }
    pickEvt();
    if (!EVT) { DATA = null; REAL = {}; if (!TEST) recs = REAL; saveLocal(); applyWho(); setSync("ok", "Synchronisé"); return; }
    const evtAsked = EVT, d = await rpc("ptg_data", { p_evt: EVT });
    if (evtAsked !== EVT) return;  // l'utilisateur a changé d'événement entre-temps
    const fresh = {};
    for (const x of d.pointages) fresh[recKey(x.iso, x.uid)] = { iso: x.iso, uid: x.uid, start: x.start || "", end: x.end || "", sign: x.sign || "" };
    for (const k in dirty) { const x = dirty[k]; if (x.evt === EVT) fresh[recKey(x.iso, x.uid)] = x; }
    const changed = JSON.stringify({ e: d.evenement, p: d.personnes }) !== JSON.stringify(DATA && { e: DATA.evenement, p: DATA.personnes });
    DATA = { evenement: d.evenement, personnes: d.personnes };
    REAL = fresh; if (!TEST) recs = REAL; saveLocal();
    if (changed) applyWho(); else renderAll();
    if (!Object.keys(dirty).length) setSync("ok", "Synchronisé");
    flush();
  } catch (e) { if (e.badCode) askCode(true); else setSync("local", "Hors ligne — données de ce téléphone affichées"); }
  finally { pulling = false; }
}
let flushing = false;
async function flush() {
  if (flushing || !CODE) return; flushing = true; let sent = 0;
  try {
    for (const k of Object.keys(dirty)) { sent++;
      const r = dirty[k];
      await rpc("ptg_upsert", { p_evt: r.evt, p_uid: r.uid, p_iso: r.iso, p_start: r.start, p_end: r.end, p_sign: r.sign });
      delete dirty[k]; saveLocal();
    }
    setSync("ok", "Synchronisé");
    if (sent) setTimeout(pull, 50);  // relit la base (ex. mention « modif. le … par … » ajoutée par le serveur)
  } catch (e) {
    if (e.badCode) { flushing = false; return askCode(true); }
    if (e.net) setSync("local", "Hors ligne — " + Object.keys(dirty).length + " modification(s) en attente");
    else { dirty = {}; saveLocal(); setSync("local", "Refusé : " + explain(e)); pulling = false; setTimeout(pull, 50); }
  } finally { flushing = false; }
}
// correction d'heures (admin / responsable) : enregistrée localement puis envoyée
function put(iso, p, data) {
  if (!TEST && !canEdit(p)) { setSync("local", "Lecture seule : modification réservée aux responsables"); return; }
  const k = recKey(iso, p.id);
  recs[k] = { iso, uid: p.id, start: data.start || "", end: data.end || "", sign: data.sign || "" };
  renderAll(); if (TEST) return;
  dirty[EVT + "|" + k] = Object.assign({ evt: EVT }, recs[k]); saveLocal(); flush();
}
// pointage de son propre compte : l'heure est celle du serveur
async function pointAction(action, iso) {
  setSync("loading", "Enregistrement…");
  try { await rpc("ptg_pointer", { p_evt: EVT, p_action: action, p_iso: iso || null }); setSync("ok", "Enregistré"); pull(); }
  catch (e) { if (e.badCode) return askCode(true); setSync("local", e.net ? "Pas de réseau : pointage non enregistré, réessaie" : "Refusé : " + explain(e)); renderAll(); }
}
function act(action, iso, newRec) {
  const p = cur();
  if (!TEST && WHO && p.id === WHO.id) return pointAction(action, iso);
  put(iso, p, newRec);
}

// ---------- Connexion ----------
function askCode(bad) {
  if (bad) { WHO = null; CODE = ""; ls.del("ptg-who"); ls.del("ptg-code"); applyWho(); }
  $("login").classList.remove("hide"); $("lmsg").textContent = bad ? "Code incorrect ou désactivé." : "";
}
$("lcode").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("lok").click(); } });
$("lok").onclick = async () => {
  CODE = $("lcode").value.trim(); if (!CODE) { $("lmsg").textContent = "Saisis ton code."; return; }
  const b = $("lok"); if (b.disabled) return; b.disabled = true; b.textContent = "Vérification…"; $("lmsg").textContent = "";
  try {
    WHO = await rpc("ptg_me");
    REAL = {}; dirty = {}; DATA = null; EVT = 0; if (!TEST) recs = REAL; saveLocal();
    ls.set("ptg-code", CODE); ls.set("ptg-who", JSON.stringify(WHO)); ls.del("ptg-me-uid");
    $("login").classList.add("hide"); applyWho(); pull();
  } catch (e) { $("lmsg").textContent = explain(e); }
  finally { b.disabled = false; b.textContent = "Valider"; }
};
$("logout").onclick = () => {
  const n = Object.keys(dirty).length;
  confirmBox((n ? "<b>" + n + " modification(s) pas encore envoyée(s)</b> seront perdues.<br>" : "") + "Se déconnecter de ce téléphone ?", () => {
    CODE = ""; WHO = null; REAL = {}; dirty = {}; DATA = null; EVT = 0; recs = REAL; ["ptg-code", "ptg-who", "ptg-recs", "ptg-dirty", "ptg-me-uid", "ptg-data", "ptg-evt"].forEach(ls.del);
    applyWho(); askCode(false);
  });
};
function confirmBox(html, ok) {
  $("mtxt").innerHTML = '<div style="font-size:18px;text-align:center;padding:6px 0">' + html + "</div>";
  $("modal").classList.remove("hide");
  $("mno").onclick = () => $("modal").classList.add("hide");
  $("myes").onclick = () => { $("modal").classList.add("hide"); ok(); };
}

// ---------- Pointer ----------
function openShift(now) {
  const t = isoOf(now), y = new Date(now); y.setDate(y.getDate() - 1); const yi = isoOf(y);
  for (const iso of [t, yi]) { const r = rec(iso); if (r.start && !r.end && rowByIso(iso)) return iso; }
  return null;
}
function weekOf(iso) { let start = 0; for (let i = 0; i < ROWS.length; i++) { if (ROWS[i].kind === "week") { if (ROWS[i].days.includes(iso)) return ROWS[i]; } } return null; }
function renderPointer() {
  const now = NOW(), p = cur();
  $("clock").textContent = hm(now);
  $("today").textContent = now.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
  const b = $("btn"); let note = "";
  if (!p) { b.disabled = true; b.className = "big"; b.textContent = WHO ? "Aucun planning" : "Connexion…"; $("pnote").innerHTML = ""; $("mini").innerHTML = ""; ["sIn", "sOut", "sTot"].forEach(i => $(i).textContent = "—"); return; }
  const open = openShift(now), t = isoOf(now), iso = open || t, r = rec(iso);
  $("sIn").textContent = r.start || "—"; $("sOut").textContent = r.end || "—";
  const live = r.start && !r.end ? dayHours(r.start, hm(now)) : dayHours(r.start, r.end);
  $("sTot").textContent = live == null ? "—" : fmtH(live);
  if (!PER()) { b.disabled = true; b.className = "big"; b.textContent = "Aucun événement"; note = "Tu n'es affecté à aucun événement en cours. L'administrateur gère les équipes."; }
  else if (open) { b.disabled = false; b.className = "big out"; b.textContent = "Pointer le départ"; if (open !== t) note = "Poste commencé hier (" + r.start + ") : le départ sera noté sur cette journée."; }
  else if (!rowByIso(t)) { b.disabled = true; b.className = "big"; b.textContent = "Hors dates"; note = "« " + escH(PER().libelle) + " » a lieu du " + longDate(PER().debut) + " au " + longDate(PER().fin) + '.<br><button class="lnk" id="gotest">Essayer en mode test →</button>'; }
  else if (r.start && r.end && !r.sign) { b.disabled = false; b.className = "big"; b.textContent = "Signer la journée"; }
  else if (r.start && r.end) { b.disabled = true; b.className = "big"; b.textContent = "Journée signée ✓"; note = escH(r.sign); }
  else { b.disabled = false; b.className = "big"; b.textContent = "Pointer l'arrivée"; }
  if (!TEST && !canPoint(p)) { b.disabled = true; b.className = "big"; b.textContent = "Lecture seule"; }
  $("pnote").innerHTML = note ? '<div class="note"' + (note === escH(r.sign) ? ' style="background:var(--acc2);color:var(--acc)"' : "") + ">" + note + "</div>" : "";
  const gt = $("gotest"); if (gt) gt.onclick = () => setTest(true);
  const W = weekOf(rowByIso(t) ? t : (DAYS[0] || {}).iso);
  let h = "<tr><th>" + (W ? nice(W.label) : "") + "</th><th>Arr.</th><th>Dép.</th><th>Durée</th><th>Sig.</th></tr>";
  if (W) { for (const d of W.days) { const x = rec(d), dh = dayHours(x.start, x.end); h += "<tr><td style='text-transform:capitalize'>" + short(rowByIso(d).label) + "</td><td>" + (x.start || "") + "</td><td>" + (x.end || "") + "</td><td>" + (dh == null ? "" : fmtH(dh)) + "</td><td style='color:var(--acc)'>" + (x.sign ? "✓" : "") + "</td></tr>"; }
    h += "<tr class='strong'><td>Total</td><td></td><td></td><td>" + fmtH(sumHours(recs, p.id, W.days)) + "</td><td></td></tr>"; }
  $("mini").innerHTML = h;
}
$("btn").onclick = () => {
  const now = NOW(), open = openShift(now), t = isoOf(now), p = cur();
  if (open) { const r = rec(open); confirmBox("Départ de <b>" + escH(p.nom) + "</b> à <b>" + hm(now) + "</b> ?", () => act("depart", open, Object.assign({}, r, { end: hm(now) }))); }
  else if (rowByIso(t) && rec(t).start && rec(t).end) { const r = rec(t); if (!r.sign) confirmBox("Signer la journée de <b>" + escH(p.nom) + "</b> (" + r.start + " → " + r.end + ") ?", () => act("signer", t, Object.assign({}, r, { sign: "✓ " + p.nom + " " + ddmm(now) + " " + hm(now) }))); }
  else if (rowByIso(t)) { const r = rec(t); confirmBox("Arrivée de <b>" + escH(p.nom) + "</b> à <b>" + hm(now) + "</b> ?", () => act("arrivee", t, Object.assign({}, r, { start: hm(now) }))); }
};

// ---------- Planning (corrections : admin / responsable) ----------
let planKey = "";
function renderPlanning() {
  const p = cur(), per = PER(), key = (per ? per.id + per.debut + per.fin : "") + (TEST ? "T" + TEST_DAY : "");
  if (key !== planKey) {
    planKey = key; let h = "", todayIso = isoOf(NOW()), block = [];
    for (const x of ROWS) {
      if (x.kind === "day") { block.push(x); continue; }
      if (x.kind !== "week") continue;
      h += '<h3><span>' + nice(x.label) + '</span><span data-wt="' + x.days[0] + '"></span></h3>';
      for (const d of block) h += '<div class="day' + (d.iso === todayIso ? " today" : "") + '" id="d-' + d.iso + '"><div class="lbl">' + short(d.label) + '</div><div class="tot" data-dt></div>' +
        '<div class="times"><input type="time" data-iso="' + d.iso + '" data-f="start" aria-label="Arrivée"><span>→</span><input type="time" data-iso="' + d.iso + '" data-f="end" aria-label="Départ"><button class="clr" data-clr="' + d.iso + '" aria-label="Effacer">×</button></div>' +
        '<div class="sg"><button data-sg="' + d.iso + '">Signer</button><span data-sgt></span></div></div>';
      block = [];
    }
    $("weeks").innerHTML = h || "<div class='card'>Aucun événement.</div>";
  }
  if (!p) return;
  for (const d of DAYS) {
    const el = $("d-" + d.iso); if (!el) continue; const r = rec(d.iso);
    for (const i of el.querySelectorAll("input")) if (document.activeElement !== i) i.value = r[i.dataset.f] || "";
    const dh = dayHours(r.start, r.end); el.querySelector("[data-dt]").textContent = dh == null ? "" : fmtH(dh);
    const sb = el.querySelector("[data-sg]"); sb.className = r.sign ? "on" : ""; sb.textContent = r.sign ? "Signé" : "Signer";
    el.querySelector("[data-sgt]").textContent = r.sign || "";
  }
  for (const s of $("weeks").querySelectorAll("[data-wt]")) { const W = weekOf(s.dataset.wt); s.textContent = W ? fmtH(sumHours(recs, p.id, W.days)) : ""; }
}
$("weeks").addEventListener("change", e => {
  const i = e.target; if (!i.dataset.iso) return;
  const r = Object.assign({}, rec(i.dataset.iso)); r[i.dataset.f] = i.value; put(i.dataset.iso, cur(), r);
});
$("weeks").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; const p = cur();
  if (b.dataset.clr) { const iso = b.dataset.clr; confirmBox("Effacer la journée du " + rowByIso(iso).label + " pour " + escH(p.nom) + " ?", () => put(iso, p, {})); }
  if (b.dataset.sg) {
    const iso = b.dataset.sg, r = Object.assign({}, rec(iso));
    if (r.sign) confirmBox("Retirer la signature ?", () => { r.sign = ""; put(iso, p, r); });
    else { const n = NOW(); r.sign = "✓ " + p.nom + " " + ddmm(n) + " " + hm(n); put(iso, p, r); }
  }
});

// ---------- Totaux, détail et export ----------
function saveFile(bytes, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
const fileName = s => s.replace(/[^A-Za-z0-9À-ÿ_-]+/g, "_");
function renderExport() {
  const per = PER();
  if (!per) { $("sum").innerHTML = "<tr><td>Aucun événement.</td></tr>"; $("detail").innerHTML = ""; }
  else {
    let h = "<tr><th></th>" + P.map(p => "<th>" + escH(p.nom) + "</th>").join("") + "</tr>";
    const allDays = DAYS.map(d => d.iso);
    for (const x of ROWS) {
      if (x.kind === "day") continue;
      const days = x.kind === "total" ? allDays : x.days;
      h += "<tr" + (x.kind === "week" ? "" : " class='strong'") + "><td>" + nice(x.label) + "</td>" + P.map(p => "<td>" + fmtH(sumHours(recs, p.id, days)) + "</td>").join("") + "</tr>";
    }
    $("sum").innerHTML = h;
    renderDetail();
  }
  if (role() === "admin") { loadAdmin(); }
}
function renderDetail() {
  const p = cur(); if (!p) { $("detail").innerHTML = ""; return; }
  const mine = canPoint(p), today = isoOf(NOW());
  let h = "<b>Détail — " + escH(p.nom) + "</b><table style='margin-top:8px'><tr><th>Jour</th><th>Arr.</th><th>Dép.</th><th>Durée</th><th>Sig.</th></tr>";
  for (const x of ROWS) {
    if (x.kind === "day") {
      const r = rec(x.iso), dh = dayHours(r.start, r.end), signable = mine && r.start && r.end && !r.sign && x.iso <= today;
      h += "<tr><td style='text-transform:capitalize'>" + short(x.label) + "</td><td>" + (r.start || "") + "</td><td>" + (r.end || "") + "</td><td>" + (dh == null ? "" : fmtH(dh)) + "</td><td>" +
        (r.sign ? "<span style='color:var(--acc)'>✓</span>" : signable ? "<button class='lnk' style='padding:0' data-sig='" + x.iso + "'>Signer</button>" : "") + "</td></tr>";
    } else {
      const days = x.kind === "total" ? DAYS.map(d => d.iso) : x.days;
      h += "<tr class='strong'><td>" + nice(x.label) + "</td><td></td><td></td><td>" + fmtH(sumHours(recs, p.id, days)) + "</td><td></td></tr>";
    }
  }
  $("detail").innerHTML = h + "</table><button class='big' id='expd' style='font-size:17px;padding:16px'>Exporter le détail (.xlsx)</button>";
}
$("detail").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; const p = cur();
  if (b.id === "expd") return saveFile(buildPlanningXlsx(recs, PER(), [p]), "Heures_" + fileName(p.nom) + "_" + fileName(PER().libelle) + ".xlsx");
  if (b.dataset.sig) { const iso = b.dataset.sig, r = rec(iso); confirmBox("Signer la journée du " + rowByIso(iso).label + " ?", () => act("signer", iso, Object.assign({}, r, { sign: "✓ " + p.nom + " " + ddmm(NOW()) + " " + hm(NOW()) }))); }
});
$("exp").onclick = () => {
  try { saveFile(buildPlanningXlsx(recs, PER(), P), "Planning_" + fileName(PER().libelle) + ".xlsx"); $("emsg").textContent = "Fichier téléchargé."; }
  catch (e) { $("emsg").textContent = "Échec : " + e.message; }
};

// ---------- Administration : périodes et utilisateurs ----------
let ADM = { users: null, evts: null, msgU: "", msgE: "", loading: false };
async function loadAdmin(force) {
  if (ADM.loading) return;
  if (!force && ADM.users && ADM.evts) return renderAdmin();
  ADM.loading = true;
  try { [ADM.users, ADM.evts] = await Promise.all([rpc("ptg_users"), rpc("ptg_evenements")]); }
  catch (e) { ADM.msgU = ADM.msgE = explain(e); }
  ADM.loading = false; renderAdmin();
}
function renderAdmin() {
  const sel = (v, opts) => opts.map(([k, l]) => '<option value="' + k + '"' + (String(k) === String(v == null ? "" : v) ? " selected" : "") + ">" + l + "</option>").join("");
  const users = (ADM.users || []).filter(u => u.actif);
  if (!$("periodes").contains(document.activeElement)) {
    const it = q => {
      const eq = {}; for (const m of (q.equipe || [])) eq[m.uid] = m.ordre;
      return '<div class="it" data-id="' + (q.id || "") + '"><input data-k="nom" placeholder="Nom (ex. Salon de Lille 2027)" value="' + escH(q.nom) + '" style="grid-column:1/-1">' +
        '<label class="full">Du <input type="date" data-k="debut" value="' + escH(q.debut) + '"></label><label class="full">au <input type="date" data-k="fin" value="' + escH(q.fin) + '"></label>' +
        '<div style="grid-column:1/-1;font-size:13px;color:var(--mut)">Équipe (case cochée) et place dans l\'Excel :</div>' +
        users.map(u => '<label class="full eq" data-uid="' + u.id + '"><input type="checkbox" data-k="in"' + (u.id in eq ? " checked" : "") + '> <span style="flex:1">' + escH(u.nom) + ' <small style="color:var(--mut)">' + ({ admin: "admin", responsable: "resp.", salarie: "salarié" })[u.role] + '</small></span><input type="number" min="1" max="99" data-k="ordre" placeholder="place" value="' + escH(eq[u.id]) + '" style="max-width:80px"></label>').join("") +
        '<label><input type="checkbox" data-k="archive"' + (q.archive ? " checked" : "") + "> Archivé</label><button class='lnk' data-save style='text-align:right'>" + (q.id ? "Enregistrer" : "Créer") + "</button></div>";
    };
    $("periodes").innerHTML = "<b>Événements</b><div style='font-size:13px;color:var(--mut)'>Plusieurs événements peuvent avoir lieu en même temps. Chacun ne voit que ceux de son équipe ; un événement archivé disparaît pour les non-admins.</div>" +
      (ADM.evts || []).map(it).join("") + "<div class='sub'>Nouvel événement</div>" + it({}) + "<div class='msg'>" + escH(ADM.msgE) + "</div>";
  }
  if (!$("users").contains(document.activeElement)) {
    const it = u => '<div class="it" data-id="' + (u.id || "") + '"><input data-k="nom" placeholder="Prénom" value="' + escH(u.nom) + '" maxlength="40"><input data-k="code" placeholder="Code (8 car. min.)" value="' + escH(u.code) + '">' +
      '<select data-k="role">' + sel(u.role || "salarie", [["salarie", "Salarié"], ["responsable", "Responsable"], ["admin", "Administrateur"]]) + "</select>" +
      '<label><input type="checkbox" data-k="actif"' + (u.actif === false ? "" : " checked") + "> Actif</label><span></span><button class='lnk' data-save style='text-align:right'>" + (u.id ? "Enregistrer" : "Créer") + "</button></div>";
    $("users").innerHTML = "<b>Comptes</b><div style='font-size:13px;color:var(--mut)'>Le rôle vaut pour tous les événements. L'affectation aux événements se fait dans « Événements ».</div>" +
      (ADM.users || []).map(it).join("") + "<div class='sub'>Nouveau compte</div>" + it({ actif: true }) + "<div class='msg'>" + escH(ADM.msgU) + "</div>";
  }
}
$("periodes").addEventListener("click", async e => {
  const b = e.target.closest("[data-save]"); if (!b) return;
  const box = b.closest(".it"), v = k => box.querySelector('[data-k="' + k + '"]');
  const equipe = [...box.querySelectorAll(".eq")].filter(l => l.querySelector('[data-k="in"]').checked)
    .map(l => ({ uid: +l.dataset.uid, ordre: l.querySelector('[data-k="ordre"]').value ? +l.querySelector('[data-k="ordre"]').value : null }));
  b.disabled = true;
  try {
    const id = await rpc("ptg_evenement_save", { p_id: box.dataset.id ? +box.dataset.id : null, p_nom: v("nom").value, p_debut: v("debut").value || null, p_fin: v("fin").value || null, p_archive: v("archive").checked, p_equipe: equipe });
    ADM.msgE = "Enregistré."; document.activeElement.blur(); await loadAdmin(true); pull();
  } catch (x) { ADM.msgE = explain(x); renderAdmin(); }
  finally { b.disabled = false; }
});
$("users").addEventListener("click", async e => {
  const b = e.target.closest("[data-save]"); if (!b) return;
  const box = b.closest(".it"), v = k => box.querySelector('[data-k="' + k + '"]'), id = box.dataset.id ? +box.dataset.id : null, code = v("code").value.trim();
  b.disabled = true;
  try {
    await rpc("ptg_user_save", { p_id: id, p_new_code: code, p_nom: v("nom").value, p_role: v("role").value, p_actif: v("actif").checked });
    if (WHO && id === WHO.id && code !== CODE) { CODE = code; ls.set("ptg-code", CODE); }
    ADM.msgU = "Enregistré."; document.activeElement.blur(); await loadAdmin(true); pull();
  } catch (x) { ADM.msgU = explain(x); renderAdmin(); }
  finally { b.disabled = false; }
});

// ---------- Mode test ----------
function setTest(on) {
  TEST = on; recs = on ? TESTRECS : REAL; document.body.classList.toggle("test", on);
  if (on) $("tday").innerHTML = DAYS.map(d => '<option value="' + d.iso + '"' + (d.iso === TEST_DAY ? " selected" : "") + ">" + short(d.label) + "</option>").join("");
  planKey = ""; renderAll();
}
$("tday").onchange = e => { TEST_DAY = e.target.value; planKey = ""; renderAll(); };
$("tclear").onclick = () => { TESTRECS = {}; recs = TESTRECS; renderAll(); };
$("tquit").onclick = () => setTest(false);

$("evsel").onchange = e => { EVT = +e.target.value; DATA = null; REAL = {}; if (!TEST) recs = REAL; ls.del("ptg-me-uid"); saveLocal(); applyWho(); setSync("loading", "Chargement…"); pulling = false; pull(); };
// ---------- Navigation et rendu ----------
function renderAll() {
  $("chips").innerHTML = P.map((p, i) => '<button class="chip' + (i === me ? " on" : "") + '" data-p="' + i + '">' + escH(p.nom) + (p.actif === false ? " (ancien)" : "") + (canPoint(p) || TEST ? "" : " 👁") + "</button>").join("");
  $("chips").style.flexWrap = "wrap";
  document.body.classList.toggle("ro", !TEST && !canEdit(cur()));
  if (view === "pointer") renderPointer(); if (view === "planning") renderPlanning(); if (view === "export") renderExport();
}
$("chips").onclick = e => { const b = e.target.closest("[data-p]"); if (!b) return; me = +b.dataset.p; ls.set("ptg-me-uid", P[me].id); renderAll(); };
function go(v) {
  view = v;
  for (const x of document.querySelectorAll("nav button")) x.classList.toggle("on", x.dataset.v === v);
  for (const s of ["pointer", "planning", "export"]) $("v-" + s).classList.toggle("hide", s !== v);
  renderAll();
  if (v === "planning") { const t = $("d-" + isoOf(NOW())); if (t) t.scrollIntoView({ block: "center" }); }
}
document.querySelector("nav").onclick = e => { const b = e.target.closest("button"); if (b) go(b.dataset.v); };
setInterval(() => { if (view === "pointer") renderPointer(); }, 15000);

// ---------- Démarrage ----------
applyWho();
if (!API_URL || /VOTRE/.test(API_URL + API_KEY)) setSync("local", "Base non configurée : renseigne config.js");
else if (!CODE) askCode(false);
else pull();
setInterval(pull, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) pull(); });
</script>
